<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload Chart</title>
  <script defer src="{{ url_for('static', filename='upload.js') }}"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-gray-300 to-blue-700 text-white min-h-screen flex items-center justify-center px-4 py-16">
  
  <!-- NavBar -->
<header class="bg-gray-900 text-white shadow-md fixed top-0 left-0 w-full z-50">
  <div class="w-full flex flex-row justify-between items-center px-6 py-4">
    <!-- Logo -->
    <a href="/" class="text-2xl font-bold text-indigo-400 animate-pulse whitespace-nowrap">
      Wickly
    </a>

    <!-- Navbar -->
    <nav class="flex space-x-6 text-sm md:text-base">
      <a href="{{ url_for('home') }}" class="hover:text-cyan-400 hover:underline transition duration-300">Home</a>
      <a href="{{ url_for('library') }}" class="hover:text-cyan-400 hover:underline transition duration-300">Upload</a>
    </nav>
  </div>
</header>

<div class="w-full max-w-xl flex flex-col items-stretch gap-6">

   <div class="w-full flex justify-center mt-20">
  <div class="bg-gradient-to-r from-gray-900 to-black p-4 rounded-lg shadow-lg 
              w-full max-w-md text-left">
    <h2 class="text-white font-semibold mb-2">Instructions</h2>
    <ul class="text-gray-200 text-sm space-y-1">
      <li>• Include no more than 20 candlesticks per image.</li>
      <li>• Center the pattern to ensure maximum results.</li>
    </ul>
    <p class="text-yellow-200 text-xs mt-3">
      ⚠️ <span class="font-semibold">Disclaimer:</span> This tool is experimental and for educational purposes only.  
      Do not use its output as financial advice.
    </p>
  </div>
</div>



  <div class="bg-gradient-to-r from-purple-300 to-blue-900 p-10 rounded-2xl shadow-xl w-full max-w-2xl text-center">
    <h1 class="text-4xl font-bold text-cyan-400 mb-6">Upload Your Candlestick Chart</h1>

    <input 
      type="file" 
      id="upload" 
      accept="image/*" 
      class="block w-full text-white bg-gray-800 border border-gray-600 p-3 rounded mb-6 cursor-pointer" 
    />

    <img 
      id="preview" 
      class="hidden w-full rounded-lg border border-gray-700 mb-6 shadow-lg" 
      alt="Image Preview"
    />

    <pre 
      id="result" 
      class="hidden text-cyan-200 font-semibold text-lg mt-4" 
    ></pre>
  </div>

</body>
</html>
